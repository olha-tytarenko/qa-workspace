[project]
name = "app"
version = "0.1.0"
description = "QA Workspace backend: FastAPI service on async SQLAlchemy and PostgreSQL."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.2.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=2.3.1",
    "pytest>=8.3.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs the PostgreSQL test database (TEST_DATABASE_URL, via Docker Compose)",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting,
# UP: modern syntax, B: bug-prone patterns (flake8-bugbear).
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
files = ["app", "migrations", "tests"]
strict = true
